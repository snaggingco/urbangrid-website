name: UrbanGrid website gateway CI

on:
  pull_request:
    branches: [main, release/uae-dos-v1-blockers-20261004]
  push:
    branches: [integration/github-canonical-country-gateway, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies (verify local toolchain)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefer-online || {
            npm cache clean --force
            npm ci --no-audit --no-fund --prefer-online
          }
          node -e "require.resolve('typescript'); require.resolve('vite'); require.resolve('esbuild')"
          test -x node_modules/.bin/tsc
      - run: npm run check
      - run: npm run build
