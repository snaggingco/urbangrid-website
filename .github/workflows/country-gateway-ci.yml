name: UrbanGrid website gateway CI

on:
  pull_request:
    branches: [main, release/uae-dos-v1-blockers-20261004]
  push:
    branches: [integration/github-canonical-country-gateway, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
