name: UAE Production operations retry and status
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: uae-production-operations
  cancel-in-progress: false
jobs:
  tick:
    if: github.repository == 'snaggingco/urbangrid-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Wake Autoscale and await bounded durable delivery and reconciliation
        env:
          URBANGRID_NETWORK_INTEGRATION_KEY: ${{ secrets.URBANGRID_NETWORK_INTEGRATION_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.URBANGRID_NETWORK_INTEGRATION_KEY;
          if (!key || key.length < 48) {
            console.error("Production integration credential is unavailable");
            process.exit(1);
          }
          try {
            const response = await fetch("https://urbangrid.ae/api/integrations/operations/tick", {
              method: "POST", redirect: "error", signal: AbortSignal.timeout(90000),
              headers: { "Content-Type": "application/json", "x-urbangrid-key": key },
              body: "{}",
            });
            const body = await response.json().catch(() => null);
            console.log(`Production operations tick HTTP ${response.status}`);
            if (!response.ok || body?.completed !== true || body?.environment !== "production") process.exitCode = 1;
          } catch {
            console.error("Production operations tick failed; persisted retries remain pending");
            process.exitCode = 1;
          }
          NODE
