<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      display: flex;
      align-items: center;
      padding: 82px 88px;
      background:
        radial-gradient(circle at 88% 15%, rgba(32, 141, 104, .42), transparent 34%),
        linear-gradient(135deg, #071d17 0%, #0a3327 58%, #071713 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 34px;
      border: 1px solid rgba(255,255,255,.14);
    }
    .content { position: relative; z-index: 1; max-width: 930px; }
    .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 64px; }
    .mark {
      width: 56px; height: 56px; border: 3px solid #62d6ad;
      display: grid; place-items: center; font-size: 26px; font-weight: 800;
    }
    .name { font-size: 30px; font-weight: 800; letter-spacing: .01em; }
    .eyebrow { color: #79dfbb; font-size: 19px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 65px; line-height: 1.04; letter-spacing: -.035em; max-width: 980px; }
    p { margin: 26px 0 0; color: #d3e3dd; font-size: 25px; line-height: 1.4; }
    .footer { position: absolute; right: 88px; bottom: 74px; color: #9fc5b7; font-size: 19px; }
  </style>
</head>
<body>
  <div class="content">
    <div class="brand"><div class="mark">UG</div><div class="name">UrbanGrid</div></div>
    <div class="eyebrow">Independent property inspection</div>
    <h1>Property Snagging &amp; Inspection Across the UAE</h1>
    <p>Engineer-led inspections · Photographic reports · All seven emirates</p>
  </div>
  <div class="footer">urbangrid.ae</div>
</body>
</html>
